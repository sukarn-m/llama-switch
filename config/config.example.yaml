# llama-switch configuration template
# Copy to config.yaml and adjust for your machine.
# See AGENTS.md for field reference.

server:
  host: "127.0.0.1"
  port: 8080
  backend_port_start: 8201
  backend_port_end: 8299
  max_models: 2
  idle_timeout_minutes: 60
  health_timeout_seconds: 180
  sweep_interval_seconds: 15
  queue_max_depth: 64           # max requests queued when eviction blocked
  queue_timeout_seconds: 600   # max wait in capacity queue (10 min)
  profile_drain_seconds: 60    # drain timeout before profiling
  shutdown_drain_seconds: 120  # drain timeout before stopping backends on SIGTERM

  # ── Security ──────────────────────────────────────────────────────
  # API key required on every endpoint except /health. Clients send it as
  # "Authorization: Bearer <key>" or "X-Api-Key: <key>". Leave empty to
  # disable client authentication. $VAR is expanded, so the key can live
  # in the environment instead of this file.
  api_key: ""

  # Browser origins allowed to call the proxy. Entries are exact origins
  # ("https://app.example"); "localhost" allows any localhost origin;
  # "*" allows any origin; "none" allows none. An empty list allows no
  # browser origin at all — non-browser clients (curl, Open WebUI's
  # server, opencode, Hermes) send no Origin header and are unaffected.
  cors_allow_origins: []
  cors_allow_credentials: false
  cors_preflight_max_age: 600

  # Backend endpoints the proxy will forward. Empty uses the built-in list
  # of inference endpoints only; llama.cpp's administrative surface
  # (/props, /slots, /lora-adapters, /cors-proxy, /tools) is never
  # reachable through the proxy.
  forward_paths: []

backend:
  binary: "~/sources/llama.cpp-cuda/llama-server"
  env:
    LD_LIBRARY_PATH: "~/sources/llama.cpp-cuda:~/.local/lib/python3.14/site-packages/nvidia/nccl/lib:~/.local/lib/python3.14/site-packages/nvidia/cudnn/lib"
  common_args:
    - "--batch-size"
    - "2048"
    - "--ubatch-size"
    - "512"
    - "--flash-attn"
    - "on"
    - "--kv-unified"
  workdir: "~"
  nvidia_smi: "nvidia-smi"
  ctx_checkpoints: 4
  cache_ram: 1024  # host-memory prompt cache limit in MiB (0 = disable)

  # API key the backends require. The proxy passes it to llama-server via
  # LLAMA_API_KEY and sends it on every request, so no other local
  # process can drive a backend directly and bypass the proxy's routing
  # and VRAM admission control. Leave empty to disable.
  api_key: ""

models:
  - id: example-model
    name: Example-Model-1.0
    path: "~/models/example-model.gguf"
    mmproj: "~/models/mmproj-F32.gguf"   # also makes /v1/models advertise image input
    # vision: true   # override image-input detection (e.g. for raw `args` models)
    context_size: 0   # 0 = let llama-server use the model's default context
    parallel: 2
    devices: ["CUDA0", "CUDA1"]
    tensor_split: "0.85,0.15"
    ctx_checkpoints: 4
    extra_args:
      - "--cache-type-k"
      - "q8_0"
      - "--cache-type-v"
      - "q8_0"
